<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台北天氣預報的真相只有一個</title>
    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* 顏色主題：更深的黑色、更亮的紅色、科技藍 (用於強調) */
            --conan-red: #E03535; /* 亮紅 */
            --conan-black: #0F0F0F; /* 深黑 */
            --conan-dark-bg: #1A1A1A; /* 背景深灰 */
            --conan-accent-blue: #3E92CC; /* 科技藍用於分隔線或細節 */
            --conan-white: #FFFFFF;
            --conan-light-grey: #D0D0D0; /* 用於文字和邊框 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--conan-dark-bg);
            /* 模擬科技介面的網格背景 */
            background-image: 
                linear-gradient(90deg, var(--conan-black) 1px, transparent 1px),
                linear-gradient(var(--conan-black) 1px, transparent 1px);
            background-size: 40px 40px;
            background-color: var(--conan-dark-bg);
            min-height: 100vh;
            color: var(--conan-white);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 頂部狀態列 (更具科技感) */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 15, 15, 0.95); /* 深黑近乎不透明 */
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid var(--conan-accent-blue); /* 科技藍底線 */
        }

        .location-pill {
            background: linear-gradient(135deg, var(--conan-red), #B01010); /* 漸層紅 */
            color: var(--conan-white);
            padding: 8px 18px;
            border-radius: 3px; /* 更銳利的邊角 */
            font-weight: 900;
            font-size: 1.15rem;
            border: 2px solid var(--conan-white);
            box-shadow: 0 0 10px rgba(224, 53, 53, 0.5); /* 霓虹紅光 */
            letter-spacing: 1px;
        }

        .update-pill {
            font-size: 0.9rem;
            color: var(--conan-light-grey);
            background: rgba(62, 146, 204, 0.1); /* 淺科技藍背景 */
            padding: 5px 12px;
            border-radius: 3px;
            font-family: 'Oswald', sans-serif;
            border: 1px solid var(--conan-accent-blue);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === 核心：今日焦點卡片 (強化棱角與光澤) === */
        .hero-card {
            background: linear-gradient(145deg, #222222, #111111); /* 深色漸層背景 */
            border-radius: 5px; 
            padding: 40px 30px;
            text-align: center;
            /* 內凹陰影和發光邊框，模擬儀器面板 */
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.9), /* 內凹效果 */
                0 0 10px var(--conan-red), /* 外部紅光 */
                0 5px 20px rgba(0, 0, 0, 0.7); 
            border: 1px solid var(--conan-red); 
            margin-bottom: 30px;
            position: relative;
            color: var(--conan-white);
            overflow: hidden;
        }

        /* 柯南的目標鎖定/瞄準線背景效果 (更細膩、使用藍色) */
        .hero-card::before {
            content: 'TARGET ACQUIRED';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at center, rgba(62, 146, 204, 0.15) 10%, transparent 20%),
                repeating-linear-gradient(90deg, var(--conan-accent-blue) 0 1px, transparent 1px 100%),
                repeating-linear-gradient(0deg, var(--conan-accent-blue) 0 1px, transparent 1px 100%);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: 0;
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: var(--conan-accent-blue);
            padding-top: 5px;
        }

        .hero-period {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--conan-red);
            color: var(--conan-white);
            padding: 5px 15px;
            font-weight: 900;
            font-size: 1rem;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); /* 斜切角裝飾 */
            z-index: 1;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0 15px;
            position: relative;
            z-index: 1;
        }

        .hero-icon {
            font-size: 6.5rem; /* 圖標更大 */
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.7); /* 天氣圖標發光 */
            transition: transform 0.3s;
        }
        
        .hero-icon:hover {
            transform: scale(1.05);
        }

        .hero-temp {
            font-size: 6.5rem; /* 溫度數字加大 */
            font-weight: 900;
            color: var(--conan-red);
            line-height: 1;
            font-family: 'Oswald', sans-serif; /* 數字使用Oswald */
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        }

        .hero-desc {
            font-size: 1.8rem;
            color: var(--conan-light-grey);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 2px;
            border-bottom: 3px solid var(--conan-accent-blue); /* 科技感分隔線 */
            padding-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        /* === 偵探的線索：快速建議區 (資訊框) === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--conan-light-grey);
            position: relative;
            z-index: 1;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #252525;
            padding: 15px 10px;
            border-radius: 5px;
            border: 1px solid var(--conan-accent-blue);
            box-shadow: 0 0 8px rgba(62, 146, 204, 0.2); /* 藍色邊緣發光 */
        }

        .advice-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .advice-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--conan-white);
            margin: 5px 0 0;
            line-height: 1.3;
            text-align: center;
        }
        
        .advice-item div:last-child {
             font-size: 0.8rem; 
             color: var(--conan-accent-blue); 
             margin-top: 5px;
        }


        /* === 稍後預報：橫向滑動區 (時間軸) === */
        .section-title {
            font-size: 1.4rem;
            color: var(--conan-white);
            margin-bottom: 15px;
            margin-left: 5px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(224, 53, 53, 0.4); /* 紅色光暈標題 */
            text-transform: uppercase;
            border-left: 5px solid var(--conan-red);
            padding-left: 10px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 15px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* 迷你卡片 (未來預報) */
        .mini-card {
            min-width: 130px;
            background: #181818; 
            border-radius: 3px;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid var(--conan-dark-bg); 
            flex-shrink: 0;
            color: var(--conan-white);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }
        
        .mini-card:hover {
            transform: translateY(-5px);
            border-color: var(--conan-red);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(224, 53, 53, 0.3);
        }

        .mini-time {
            background: var(--conan-accent-blue);
            color: var(--conan-white);
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
            font-family: 'Oswald', sans-serif;
        }

        .mini-icon {
            font-size: 2.2rem;
            margin: 5px 0;
        }

        .mini-temp {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--conan-white);
            font-family: 'Oswald', sans-serif;
        }
        
        /* 降雨率使用科技藍顯示 */
        .mini-card div:last-child {
            color: var(--conan-accent-blue) !important;
            font-weight: 700;
        }

        /* Loading 畫面 (維持科技風格) */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--conan-black); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: var(--conan-white);
        }

        .loading-screen div {
             animation: spin 1.5s infinite linear;
             font-size: 4rem;
             color: var(--conan-red);
             text-shadow: 0 0 10px var(--conan-red);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-screen p {
            color: var(--conan-accent-blue) !important;
            font-weight: 700;
            margin-top: 20px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem;">🔍</div>
        <p style="color: white; font-weight: bold; margin-top: 20px;">正在解析案件（觀測天氣數據）...</p>
    </div>
    <div class="status-bar">
        <div class="location-pill">🚨 臺北 現場</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
        </div>

        <h3 class="section-title">未來線索追蹤</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>

    </div>

    <script>
        // API 不變 (抓取高雄數據)
        const API_URL = "https://weather-taipei108.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            // 替換成更銳利或中性的圖標
            if (!weather) return "🌤️";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "🌥️"; // 稍微不同
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "☔"; // 換成雨傘
            if (weather.includes("雷")) return "⚡"; // 閃電圖標
            return "🌥️";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🚫"; // 禁用符號
            let rainText = "無須防備";
            if (parseInt(rainProb) > 30) {
                rainIcon = "⚠️"; // 警告
                rainText = "潛在風險（帶傘）！";
            }

            let clothIcon = "👔"; // 偵探服裝
            let clothText = "正式調查服";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🕶️"; // 墨鏡
                clothText = "輕便喬裝模式";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥"; // 外套
                clothText = "隱藏身形（加外套）";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨佈局";
            if (hour >= 11 && hour < 14) return "中午交鋒";
            if (hour >= 14 && hour < 18) return "下午追蹤";
            if (hour >= 18 && hour < 23) return "夜晚潛伏";
            return "深夜行動";
        }

        function renderWeather(data) {
            if (!data || !data.forecasts || data.forecasts.length === 0) {
                 throw new Error("API Returned invalid or empty data.");
            }
            
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">🕵️ ${period}</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">真相：${current.weather}</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.rainIcon}</div>
                                    <div class="advice-text">${advice.rainText}</div>
                                    <div>降雨機率 P(${current.rain})</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.clothIcon}</div>
                                    <div class="advice-text">${advice.clothText}</div>
                                    <div>最高溫度 T(${current.maxTemp}°)</div>
                                </div>
                            </div>
                        </div>
                    `;

            // 2. 渲染稍後預報 (包含明天判斷)
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "🚨 明日" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                                <div style="font-size:0.8rem; margin-top:5px;">💧P(${f.rain})</div>
                            </div>
                        `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

            document.getElementById('updateTime').textContent = `${month}/${date} ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));

                const fetchPromise = fetch(API_URL).then(res => res.json());

                const [_, json] = await Promise.all([delayPromise, fetchPromise]);
                
                if (json.success && json.data) { 
                    renderWeather(json.data); 
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else if (json.forecasts) {
                    renderWeather(json);
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error: Data format is incorrect.");
                }

            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗，黑衣組織截斷了訊號！請檢查 API 伺服器狀態。");
                document.getElementById('loading').innerHTML = `<div style="color:white; text-align:center;">
                    <div style="font-size: 3rem; margin-bottom: 10px;">🚨</div>
                    <p style="color: var(--conan-red);">連線失敗，請確認伺服器 (${API_URL}) 是否正常運行。</p>
                </div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
